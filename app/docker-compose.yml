services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: web2
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: loja
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web2 -d loja"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://web2:123456789@db:5432/loja?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
